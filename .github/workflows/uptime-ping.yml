name: Temporary Render uptime ping

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  ping:
    name: Ping Render health endpoints
    runs-on: ubuntu-latest
    timeout-minutes: 3
    if: ${{ vars.SIVAN_UPTIME_PING_ENABLED != 'false' }}
    steps:
      - uses: actions/checkout@v5
      - name: Ping WhatsApp bot and backend
        run: bash scripts/uptime-ping.sh
        env:
          UPTIME_PING_URLS: ${{ vars.SIVAN_UPTIME_PING_URLS || 'https://whatsapp-bot-ix7t.onrender.com/api/health,https://sivan-escrow-agent.onrender.com/api/health' }}
          UPTIME_PING_TIMEOUT_SECONDS: ${{ vars.SIVAN_UPTIME_PING_TIMEOUT_SECONDS || '10' }}
